# Starts the matchforge server next to a Redis database.
# Run from the repo root: docker compose -f deploy/docker-compose.yml up --build
services:
  redis:
    image: redis:7.4-alpine
    # Only other containers on this network can reach Redis. Nothing is exposed to your computer.
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    # Naming the image lets the bots service below reuse it instead of building again.
    image: matchforge:local
    build:
      # The build context is the repo root, so the Dockerfile can copy the whole project.
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    # Where the server finds Redis. "redis" is the service name above, which Docker's
    # internal DNS resolves on this network.
    environment:
      MATCHFORGE_REDIS_HOST: redis
      MATCHFORGE_REDIS_PORT: "6379"
      # The secret game servers send with match results. It comes from your shell or from a
      # deploy/.env file (never committed). Unset means empty, which disables result reporting.
      MATCHFORGE_RESULT_SECRET: ${MATCHFORGE_RESULT_SECRET:-}
    # Publish the game port to your computer, so a client on the host can connect.
    ports:
      - "7777:7777"
    # The server now runs until stopped (Milestone 1). Restart it after a crash, but not
    # after an explicit `docker compose stop`.
    restart: unless-stopped

  # Load simulator. Not started by "up"; run it on demand:
  #   docker compose -f deploy/docker-compose.yml --profile load run --rm bots
  # Extra flags after "bots" replace the defaults below, for example: ... run --rm bots --bots 200
  bots:
    image: matchforge:local
    profiles: ["load"]
    depends_on:
      - server
    entrypoint: ["/usr/local/bin/matchforge_bots", "--host", "server", "--secret", "${MATCHFORGE_RESULT_SECRET:-}"]
    command: ["--bots", "20", "--rounds", "3"]
